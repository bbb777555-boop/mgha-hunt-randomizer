  <text x="200" y="538" text-anchor="middle" fill="#1a2820" font-size="10" font-family="serif">— ✦ —</text>

  <!-- "I WANT YOU" – blood red poster -->
  <text x="202" y="572"
        text-anchor="middle"
        font-family="'Cormorant SC', 'Palatino Linotype', serif"
        font-size="50" font-weight="900" letter-spacing="1"
