  <path d="M 170,170 Q 172,90 174,26" fill="none" stroke="#080807" stroke-width="2" opacity="0.6"/>
  <path d="M 230,170 Q 228,90 226,26" fill="none" stroke="#080807" stroke-width="2" opacity="0.5"/>

