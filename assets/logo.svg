  <text x="200" y="570"
        text-anchor="middle"
        font-family="'Cormorant SC', 'Palatino Linotype', serif"
        font-size="50" font-weight="900" letter-spacing="1"
        fill="url(#redTxt)"
        stroke="#280404" stroke-width="0.8">I WANT YOU</text>

  <!-- Subtext – muted teal-brass -->
