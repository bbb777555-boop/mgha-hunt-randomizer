<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Aged parchment background -->
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#e4d4a8"/>
      <stop offset="40%"  stop-color="#dcc898"/>
      <stop offset="100%" stop-color="#c8b47c"/>
    </linearGradient>
    <!-- Corner stain -->
    <radialGradient id="stainTL" cx="0%" cy="0%" r="60%">
      <stop offset="0%"   stop-color="#b09060" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b09060" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stainBR" cx="100%" cy="100%" r="60%">
      <stop offset="0%"   stop-color="#907040" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#907040" stop-opacity="0"/>
    </radialGradient>
    <!-- Figure ink gradient – charcoal sketch style -->
    <linearGradient id="figureGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%"   stop-color="#201810"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </linearGradient>
    <!-- Pointing arm gradient -->
    <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#181408"/>
      <stop offset="100%" stop-color="#302818"/>
    </linearGradient>
  </defs>

  <!-- ═══ PARCHMENT BACKGROUND ══════════════════════════════════════════ -->
  <rect width="500" height="500" fill="url(#parchment)"/>
  <!-- Paper stains for aged look -->
  <rect width="500" height="500" fill="url(#stainTL)"/>
  <rect width="500" height="500" fill="url(#stainBR)"/>
  <!-- Subtle horizontal paper grain -->
  <rect x="0" y="0" width="500" height="500" fill="none" stroke="#c0a870" stroke-width="0.3" opacity="0.15"/>

  <!-- Grungy paper texture patches -->
  <ellipse cx="80"  cy="80"  rx="60" ry="40" fill="#b09060" opacity="0.08"/>
  <ellipse cx="420" cy="90"  rx="55" ry="35" fill="#907040" opacity="0.07"/>
  <ellipse cx="460" cy="420" rx="50" ry="45" fill="#a08050" opacity="0.09"/>
  <ellipse cx="50"  cy="440" rx="65" ry="40" fill="#907030" opacity="0.08"/>

  <!-- ═══ BORDER STRIPES (Uncle Sam / US poster style) ══════════════════ -->
  <!-- Outermost frame -->
  <rect x="8" y="8" width="484" height="484" fill="none" stroke="#1a1810" stroke-width="2"/>
  <!-- Red outer stripe -->
  <rect x="12" y="12" width="476" height="476" fill="none" stroke="#b82020" stroke-width="8"/>
  <!-- White gap -->
  <rect x="22" y="22" width="456" height="456" fill="none" stroke="#d8c898" stroke-width="4"/>
  <!-- Navy/blue inner stripe -->
  <rect x="28" y="28" width="444" height="444" fill="none" stroke="#1e2d6a" stroke-width="8"/>
  <!-- Inner content border -->
  <rect x="38" y="38" width="424" height="424" fill="none" stroke="#2a1e10" stroke-width="1.5"/>

  <!-- ═══ HUNTER FIGURE — dark ink/charcoal style ══════════════════════ -->

  <!-- --- WIDE-BRIM HAT --- -->
  <!-- Hat brim – wide, slightly angled -->
  <ellipse cx="250" cy="118" rx="110" ry="22" fill="#181208"/>
  <!-- Brim underside shadow -->
  <ellipse cx="250" cy="122" rx="108" ry="18" fill="#0c0a06"/>
  <!-- Hat crown -->
  <path d="M 174,118 L 170,38 Q 250,28 330,38 L 326,118 Z" fill="url(#figureGrad)"/>
  <!-- Crown top curve -->
  <path d="M 170,38 Q 250,28 330,38" fill="none" stroke="#0a0806" stroke-width="3"/>
  <!-- Hat band – dark blood red -->
  <rect x="172" y="100" width="156" height="18" fill="#5a0e0e"/>
  <!-- Band highlight -->
  <rect x="172" y="100" width="156" height="3" fill="#7a1414" opacity="0.7"/>
  <!-- Small band ornaments (cartridge loops / worn decoration) -->
  <circle cx="215" cy="109" r="3" fill="#3a0808"/>
  <circle cx="250" cy="109" r="3" fill="#3a0808"/>
  <circle cx="285" cy="109" r="3" fill="#3a0808"/>
  <!-- Brim front shadow line -->
  <path d="M 144,116 Q 250,108 356,116" fill="none" stroke="#0a0806" stroke-width="2.5"/>

  <!-- --- FACE / HEAD --- -->
  <path d="M 184,192 Q 182,148 198,136 Q 220,126 250,126 Q 280,126 302,136 Q 318,148 316,192 Q 314,232 298,248 Q 278,260 250,262 Q 222,260 202,248 Q 186,232 184,192 Z" fill="#6a5040"/>
  <!-- Face shadow sides -->
  <path d="M 184,188 Q 188,158 202,142 Q 190,162 188,196 Q 186,218 190,238 Z" fill="#2e1c10" opacity="0.5"/>
  <path d="M 316,188 Q 312,158 298,142 Q 310,162 312,196 Q 314,218 310,238 Z" fill="#2e1c10" opacity="0.5"/>

  <!-- Heavy brow ridge -->
  <path d="M 196,166 Q 216,158 246,160 Q 256,159 284,158 Q 306,159 308,166 Q 303,178 250,181 Q 196,179 196,166 Z" fill="#1c1008"/>

  <!-- ── ROUND SUNGLASSES ── -->
  <!-- Left lens frame -->
  <ellipse cx="222" cy="196" rx="34" ry="28" fill="#0e0c08" stroke="#1e1810" stroke-width="2.5"/>
  <!-- Right lens frame -->
  <ellipse cx="278" cy="196" rx="34" ry="28" fill="#0e0c08" stroke="#1e1810" stroke-width="2.5"/>
  <!-- Lenses (very dark, barely reflective) -->
  <ellipse cx="222" cy="196" rx="29" ry="23" fill="#080808"/>
  <ellipse cx="278" cy="196" rx="29" ry="23" fill="#080808"/>
  <!-- Subtle lens reflection -->
  <ellipse cx="212" cy="187" rx="8" ry="6" fill="#14202c" opacity="0.5"/>
  <ellipse cx="268" cy="187" rx="8" ry="6" fill="#14202c" opacity="0.5"/>
  <!-- Nose bridge -->
  <path d="M 252,194 Q 250,190 248,194" fill="none" stroke="#1a1410" stroke-width="4" stroke-linecap="round"/>
  <!-- Temple arms -->
  <path d="M 188,192 Q 170,188 158,178" fill="none" stroke="#1c1810" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 312,192 Q 330,188 342,178" fill="none" stroke="#1c1810" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 246,214 Q 242,228 240,238 Q 244,244 250,245 Q 256,244 260,238 Q 258,228 254,214 Z" fill="#4a2e18"/>
  <path d="M 236,238 Q 242,247 250,248 Q 258,247 264,238 Q 258,243 250,244 Q 242,243 236,238 Z" fill="#3a2010"/>

  <!-- Mustache – heavy, dark -->
  <path d="M 228,248 Q 238,242 250,245 Q 262,242 272,248 Q 268,256 261,253 Q 255,250 250,252 Q 245,250 239,253 Q 232,256 228,248 Z" fill="#100808"/>

  <!-- BEARD – dense, dark, full Hunter beard -->
  <path d="M 188,232 Q 194,248 200,262 Q 210,282 216,305 Q 224,330 232,348 Q 241,362 250,366 Q 259,362 268,348 Q 276,330 284,305 Q 290,282 300,262 Q 306,248 312,232 Q 318,256 314,284 Q 306,318 290,340 Q 272,358 250,362 Q 228,358 210,340 Q 194,318 186,284 Q 182,256 188,232 Z" fill="#120c06"/>
  <!-- Beard strand texture -->
  <path d="M 206,258 Q 212,285 218,312 Q 224,335 230,350" fill="none" stroke="#1c1408" stroke-width="1.5" opacity="0.7"/>
  <path d="M 214,255 Q 220,283 226,310 Q 232,334 238,350" fill="none" stroke="#1a1208" stroke-width="1.2" opacity="0.5"/>
  <path d="M 294,258 Q 288,285 282,312 Q 276,335 270,350" fill="none" stroke="#1c1408" stroke-width="1.5" opacity="0.7"/>
  <path d="M 286,255 Q 280,283 274,310 Q 268,334 262,350" fill="none" stroke="#1a1208" stroke-width="1.2" opacity="0.5"/>

  <!-- NECK -->
  <path d="M 216,342 L 220,364 L 226,374 Q 250,380 274,374 L 280,364 L 284,342" fill="#5a3820"/>

  <!-- COAT / BODY -->
  <!-- Left body -->
  <path d="M 40,460 L 40,390 Q 80,378 132,382 Q 174,386 210,390 L 214,460 Z" fill="url(#figureGrad)"/>
  <!-- Right body -->
  <path d="M 460,460 L 460,390 Q 420,378 368,382 Q 326,386 290,390 L 286,460 Z" fill="url(#figureGrad)"/>
  <!-- Center panel -->
  <path d="M 210,390 Q 250,388 290,390 L 294,460 L 206,460 Z" fill="#100e08"/>

  <!-- Left lapel -->
  <path d="M 130,390 Q 156,376 210,366 L 220,382 L 228,396 Q 215,408 194,410 Q 168,411 130,390 Z" fill="#0e0c08"/>
  <!-- Right lapel -->
  <path d="M 370,390 Q 344,376 290,366 L 280,382 L 272,396 Q 285,408 306,410 Q 332,411 370,390 Z" fill="#0e0c08"/>

  <!-- ── POINTING ARM – foreshortened toward viewer (left side of image) ── -->
  <!-- Upper sleeve, angled out -->
  <path d="M 136,386 Q 110,396 88,418 Q 70,438 58,458 Q 55,462 57,466 L 82,466 Q 86,460 100,444 Q 116,426 138,410 Q 154,398 170,392 Z" fill="url(#figureGrad)"/>
  <!-- Forearm sleeve (foreshortened, getting wider) -->
  <path d="M 58,458 Q 76,452 98,446 Q 120,440 136,436 Q 126,452 112,462 Q 96,472 76,474 Q 56,474 44,466 Z" fill="#100e08"/>
  <!-- HAND – large, close to viewer, pointing finger -->
  <path d="M 136,436 Q 154,430 174,430 Q 192,430 205,438 Q 214,446 212,460 Q 208,474 194,478 Q 178,482 160,478 Q 143,472 134,460 Q 128,450 136,436 Z" fill="#6a4828"/>
  <!-- Pointing finger extended toward viewer -->
  <path d="M 157,430 Q 168,412 180,396 Q 188,384 195,382 Q 202,384 200,396 Q 194,408 184,420 Q 174,430 163,436 Z" fill="#7a5832"/>
  <!-- Knuckle lines -->
  <path d="M 168,416 Q 174,410 180,402" fill="none" stroke="#4a3018" stroke-width="2" stroke-linecap="round"/>
  <!-- Fingernail -->
  <path d="M 190,384 Q 196,380 200,384 Q 198,392 192,394 Z" fill="#5a3818"/>
  <!-- Cuff -->
  <path d="M 134,438 Q 154,432 174,432 Q 188,432 200,440 Q 196,446 184,448 Q 164,451 140,447 Q 132,443 134,438 Z" fill="#181410"/>
  <!-- Cuff button -->
  <circle cx="142" cy="442" r="4" fill="#201810"/>
  <circle cx="142" cy="442" r="1.8" fill="#100c08"/>

  <!-- Coat crease lines -->
  <path d="M 92,394 Q 98,420 102,460" fill="none" stroke="#0a0806" stroke-width="1.5" opacity="0.5"/>
  <path d="M 410,394 Q 404,420 402,460" fill="none" stroke="#0a0806" stroke-width="1.5" opacity="0.5"/>

  <!-- ── SLIGHT INK TEXTURE OVERLAY on figure ── -->
  <path d="M 220,140 Q 218,160 220,180" fill="none" stroke="#0c0a06" stroke-width="1" opacity="0.3"/>
  <path d="M 280,140 Q 282,160 280,180" fill="none" stroke="#0c0a06" stroke-width="1" opacity="0.3"/>

  <!-- ═══ TEXT SECTION ══════════════════════════════════════════════════ -->
  <!-- Separator line above text -->
  <path d="M 44,356 L 456,356" stroke="#1e1810" stroke-width="1.5" fill="none"/>

  <!-- "I WANT" – left side, large -->
  <text x="58" y="400"
        font-family="'Rye', 'Alfa Slab One', 'Palatino Linotype', serif"
        font-size="44" font-weight="900" letter-spacing="1"
        fill="#1a1208">I WANT</text>

  <!-- "YOU" – right side, very large, bold -->
  <text x="264" y="395"
        font-family="'Rye', 'Alfa Slab One', 'Palatino Linotype', serif"
        font-size="68" font-weight="900" letter-spacing="-1"
        fill="#1a1208">YOU</text>

  <!-- "TO MAKE" – left, medium -->
  <text x="58" y="438"
        font-family="'Rye', 'Alfa Slab One', 'Palatino Linotype', serif"
        font-size="34" font-weight="900" letter-spacing="1"
        fill="#1a1208">TO MAKE</text>

  <!-- "HUNT" – large block letters left -->
  <text x="44" y="480"
        font-family="'Rye', 'Alfa Slab One', 'Palatino Linotype', serif"
        font-size="68" font-weight="900" letter-spacing="2"
        fill="#1a1208">HUNT</text>

  <!-- "GREAT AGAIN!" – right/lower, medium -->
  <text x="234" y="480"
        font-family="'Rye', 'Alfa Slab One', 'Palatino Linotype', serif"
        font-size="32" font-weight="900" letter-spacing="0.5"
        fill="#1a1208">GREAT AGAIN!</text>

  <!-- Separator line below text -->
  <path d="M 44,488 L 456,488" stroke="#1e1810" stroke-width="1" fill="none"/>
</svg>
