  <path d="M 155,485 Q 160,479 166,473" fill="none" stroke="#3a2010" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 180,453 Q 186,449 191,453 Q 189,460 184,462 Q 180,459 180,453 Z" fill="#382010"/>
  <path d="M 112,504 Q 130,498 150,498 Q 164,498 174,504 Q 170,510 158,512 Q 140,515 120,511 Q 112,508 112,504 Z" fill="#181410"/>
  <circle cx="118" cy="507" r="3.5" fill="#201810"/>
  <circle cx="118" cy="507" r="1.5" fill="#120e08"/>
  <circle cx="125" cy="505" r="3" fill="#1c1610"/>

