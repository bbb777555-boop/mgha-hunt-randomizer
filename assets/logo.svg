  <text x="372" y="30"  fill="#3a5040" font-size="14" font-family="serif">✦</text>
  <text x="14" y="595" fill="#3a5040" font-size="14" font-family="serif">✦</text>
  <text x="372" y="595" fill="#3a5040" font-size="14" font-family="serif">✦</text>

